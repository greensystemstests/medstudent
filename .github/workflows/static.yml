# Build the Vite app, then deploy the built output (dist/) to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["claude/intelligent-curie-jsa86h"]
    # NOTE: add "main" here (or switch to it) once this branch is merged
    # into main and main becomes the branch you deploy from.

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Real Postgres for the account/document API tests (server/accounts.test.js).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studybg
          POSTGRES_PASSWORD: studybg
          POSTGRES_DB: studybg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studybg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: API tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://studybg:studybg@localhost:5432/studybg_test
      - name: Build
        run: npm run build
        env:
          # Public URL of the payments API (Render). Override with a repository variable if it moves.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://studybg-api.onrender.com' }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the built output, not the whole repo/source
          path: 'dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
