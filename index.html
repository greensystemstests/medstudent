      (function() {
        try {
          var originalDefineProperty = Object.defineProperty;
          var customFetchValue;
          var hasCustomFetch = false;

          Object.defineProperty = function(obj, prop, descriptor) {
            if (
              (obj === window ||
               obj === globalThis ||
               (typeof Window !== 'undefined' && (obj instanceof Window || obj === Window.prototype))) &&
              prop === 'fetch' &&
              descriptor
            ) {
              var origGet = descriptor.get;
              var origSet = descriptor.set;

              var patchedDesc = {
                configurable: true,
                enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
                get: function() {
                  if (hasCustomFetch) return customFetchValue;
                  if (typeof origGet === 'function') return origGet.call(this);
                  return descriptor.value !== undefined ? descriptor.value : window.fetch;
                },
                set: function(val) {
                  customFetchValue = val;
                  hasCustomFetch = true;
                  if (typeof origSet === 'function') {
                    try { origSet.call(this, val); } catch (e) {}
                  }
                }
              };
              return originalDefineProperty.call(Object, obj, prop, patchedDesc);
            }
            return originalDefineProperty.apply(this, arguments);
          };

          // If fetch already has a getter without a setter on window, define a setter immediately
          var existingDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (existingDesc && existingDesc.get && !existingDesc.set) {
            var currGet = existingDesc.get;
            originalDefineProperty.call(Object, window, 'fetch', {
              configurable: true,
              enumerable: existingDesc.enumerable !== undefined ? existingDesc.enumerable : true,
              get: function() {
                if (hasCustomFetch) return customFetchValue;
                return currGet.call(this);
              },
              set: function(val) {
                customFetchValue = val;
                hasCustomFetch = true;
              }
            });
          }
        } catch (e) {
          // Fallback gracefully without breaking page execution
        }
      })();
    </script>
