# Render Blueprint for StudyBg. Invoices and retry jobs now use Postgres.
# Existing Key Value is retained; this change does not delete or upgrade any resource.
# Secrets are marked sync: false, so Render asks for them in its dashboard;
# they never live in this repository.
#
# Note: the live studybg-api service and the studybg-invoices Key Value instance
# were provisioned directly via the Render API, not by syncing this blueprint. It's kept here as
# documentation of the full setup (and so a from-scratch redeploy via "New Blueprint" works).
#
# Postgres lives on Neon, not Render (Render's free Postgres expires after 30 days).
# DATABASE_URL is a secret you paste in the Render dashboard: Neon's DIRECT connection string
# (host without "-pooler"). The server refuses the pooled one; see README "Turning on student accounts".
services:
  - type: web
    name: studybg-api
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/intelligent-curie-jsa86h
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CHECKOUT_ENABLED
        value: "false"
      - key: LEGAL_APPROVED
        value: "false"
      - key: SUPPORT_EMAIL
        sync: false
      - key: STAFF_EMAILS
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: studybg-invoices
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: INVOICE_FROM_EMAIL
        sync: false
      - key: SALE_NOTIFICATION_EMAIL
        sync: false
      - key: COMPANY_LEGAL_NAME
        sync: false
      - key: COMPANY_EIK
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_CITY
        sync: false
      - key: COMPANY_VAT_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FILE_ENCRYPTION_KEY
        generateValue: true
      - key: SITE_URL
        value: https://studybg.ac

  - type: keyvalue
    name: studybg-invoices
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
